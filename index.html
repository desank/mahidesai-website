<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahi</title>
<meta name="description" content="A quiet corner of the internet for things Mahi makes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">

</head>
<body>
  <header>
    <h1>Mahi<span class="dot">.</span></h1>
    <svg class="scribble" viewBox="0 0 220 14" aria-hidden="true">
      <path d="M4 9 C 40 2, 70 13, 110 7 S 180 3, 216 8" fill="none" stroke="#e4572e" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <p class="tagline">A quiet corner of the internet for things Mahi makes.</p>
    <p class="gallery-note">The gallery is open. Tap anything to see it big.</p>
    <nav class="nav" aria-label="Site"><a href="index.html" aria-current="page">Gallery</a><a href="books.html">Books</a></nav>
  </header>
  <main>
    <div class="gallery" id="gallery">
      <figure data-title="Disney Place"><img src="images/g-disney.jpg" width="1600" height="1104" loading="lazy" alt="Colourful drawing of a little house on top of a spotted hill with a flag that reads Disney Place, surrounded by trees and stars"></figure>
      <figure data-title="Girl in Green"><img src="images/g-girl.jpg" width="1104" height="1600" loading="lazy" alt="Green marker drawing of a girl with big eyes, curly bunches and a striped dress"></figure>
      <figure data-title="Big Bloom"><img src="images/g-flower.jpg" width="1200" height="1600" loading="lazy" alt="Painting of a big striped flower with the sun and moon above and small flowers below"></figure>
      <figure data-title="Night Sky"><img src="images/g-sky.jpg" width="1600" height="860" loading="lazy" alt="Paint-splattered night sky in yellow, blue and purple over white paper hills and trees"></figure>
      <figure data-title="Hamstle"><img src="images/g-hamster.jpg" width="1200" height="1600" loading="lazy" alt="Pencil drawing of a round apple-coloured hamster with labelled whiskers, hands, eyes, legs and mouth"></figure>
      <figure data-title="Sloth Family"><img src="images/g-sloths.jpg" width="1600" height="1200" loading="lazy" alt="Four paintings of sloths hanging from branches in green jungles, lined up in a row"></figure>
      <figure data-title="Which Princess is Which?"><img src="images/g-princess.jpg" width="1600" height="1200" loading="lazy" alt="Drawing of four princesses in colourful dresses under the words Which Princess is Which"></figure>
      <figure data-title="Under the Stars"><img src="images/g-stars.jpg" width="1200" height="1600" loading="lazy" alt="Drawing of two girls holding a big red flower under a sky full of yellow stars"></figure>
      <figure data-title="Love You Berry Much"><img src="images/g-berry.jpg" width="900" height="1600" loading="lazy" alt="Card with two smiling strawberries and the words Dad, I love you berry much"></figure>
      <figure data-title="Family"><img src="images/g-family.jpg" width="1200" height="1488" loading="lazy" alt="Black marker family drawing with patterned shapes, hearts and the words Mummy, Daddy and Mahi"></figure>
    </div>
  </main>
  <footer>made with <span class="heart">&hearts;</span> by Mahi</footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Artwork viewer">
    <button class="lb-btn lb-close" id="lbClose" aria-label="Close">&#10005;</button>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous">&#8249;</button>
    <img id="lbImg" src="" alt="">
    <p class="lb-cap" id="lbCap"></p>
    <button class="lb-btn lb-next" id="lbNext" aria-label="Next">&#8250;</button>
  </div>

<script>
(function(){
  var figs = Array.prototype.slice.call(document.querySelectorAll('#gallery figure'));
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbCap = document.getElementById('lbCap');
  var current = 0;
  function open(i){
    current = (i + figs.length) % figs.length;
    var img = figs[current].querySelector('img');
    lbImg.src = img.src;
    lbImg.alt = img.alt;
    lbCap.textContent = figs[current].getAttribute('data-title');
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function close(){
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }
  figs.forEach(function(fig, i){
    fig.setAttribute('tabindex','0');
    fig.addEventListener('click', function(){ open(i); });
    fig.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(i); }});
  });
  document.getElementById('lbClose').addEventListener('click', close);
  document.getElementById('lbPrev').addEventListener('click', function(e){ e.stopPropagation(); open(current-1); });
  document.getElementById('lbNext').addEventListener('click', function(e){ e.stopPropagation(); open(current+1); });
  lb.addEventListener('click', function(e){ if(e.target===lb) close(); });
  document.addEventListener('keydown', function(e){
    if(!lb.classList.contains('open')) return;
    if(e.key==='Escape') close();
    if(e.key==='ArrowLeft') open(current-1);
    if(e.key==='ArrowRight') open(current+1);
  });
  var touchX = null;
  lb.addEventListener('touchstart', function(e){ touchX = e.changedTouches[0].clientX; }, {passive:true});
  lb.addEventListener('touchend', function(e){
    if(touchX===null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if(Math.abs(dx) > 50) open(current + (dx < 0 ? 1 : -1));
    touchX = null;
  }, {passive:true});
})();
</script>
</body>
</html>
