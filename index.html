<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="A quiet corner of the internet for things Mahi makes. Coming soon.">
  <title>Mahi</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f7f6f4;
      --heading: #191817;
      --body: #5c5a56;
      --accent: #b4552d;
      --glyph-bg: #ffffff;
      --glyph-border: #e6e2dc;
      --glyph-shadow: 0 1px 2px rgb(25 24 23 / 7%);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background: var(--page);
      color: var(--heading);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .content {
      width: 100%;
      max-width: 370px;
      text-align: center;
    }

    .mark {
      width: 44px;
      height: 44px;
      margin: 0 auto 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--glyph-border);
      border-radius: 12px;
      background: var(--glyph-bg);
      box-shadow: var(--glyph-shadow);
      color: var(--accent);
    }

    .mark svg { display: block; width: 20px; height: 20px; }

    h1 {
      margin: 0 0 18px;
      font-size: 32px;
      line-height: 1.2;
      letter-spacing: -0.55px;
      font-weight: 700;
    }

    .description {
      max-width: 370px;
      margin: 0 auto;
      color: var(--body);
      font-size: 17px;
      line-height: 28px;
      font-weight: 400;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #121110;
        --heading: #f2f0ed;
        --body: #a5a19b;
        --accent: #e08a5f;
        --glyph-bg: #1c1a18;
        --glyph-border: #2c2926;
        --glyph-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="content" aria-labelledby="page-title">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 2.5c.6 4.2 3.3 6.9 7.5 7.5-4.2.6-6.9 3.3-7.5 7.5-.6-4.2-3.3-6.9-7.5-7.5 4.2-.6 6.9-3.3 7.5-7.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 id="page-title">Mahi</h1>
      <p class="description">A quiet corner of the internet for things Mahi makes. Coming soon.</p>
    </section>
  </main>
</body>
</html>
